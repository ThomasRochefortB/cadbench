name: Security and tests
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '21 6 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.10.0'
      - run: uv export --locked --all-groups --no-emit-project --no-hashes -o /tmp/cadbench-requirements.txt
      - run: uvx --from pip-audit==2.10.1 pip-audit -r /tmp/cadbench-requirements.txt --no-deps --disable-pip --strict
      - run: uv sync --locked --group dev
      - run: uv run --locked pytest -q
