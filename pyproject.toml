[project]
name = "cadbench"
version = "0.1.0"
description = "A benchmark for LLM capabilities in generating CAD models using FreeCAD."
authors = [{name = "Thomas Rochefort-Beaudoin"}]
requires-python = ">=3.12"
dependencies = [
    "Flask==3.0.2",
    "httpx<0.28.0",
    "python-dotenv==1.0.1",
    "Flask-Cors==4.0.0",
    "setuptools>=65.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicitly include app.py and the static directory for the build.
include = [
    "app.py",
    "config.py",
    "freecad_runner.py",
    "model_catalog.py",
    "openrouter_client.py",
    "prompts.py",
    "script_normalizer.py",
    "static/",
]
